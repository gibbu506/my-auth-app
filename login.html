<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <link rel="icon" type="image/x-icon" href="/favicon.ico"/>
  <link rel="manifest" href="/manifest.json"/>
  <meta name="theme-color" content="#c8f55a"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0a;
      --surface: #111111;
      --border: #222222;
      --accent: #c8f55a;
      --text: #f0f0f0;
      --muted: #666;
      --error: #ff5f5f;
      --radius: 12px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      width: 420px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px;
      animation: slideUp 0.4s cubic-bezier(0.22,1,0.36,1) both;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .logo {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 22px;
      letter-spacing: -0.5px;
      margin-bottom: 32px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-dot {
      width: 10px;
      height: 10px;
      background: var(--accent);
      border-radius: 50%;
    }

    .tabs {
      display: flex;
      background: var(--bg);
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 32px;
      border: 1px solid var(--border);
    }

    .tab {
      flex: 1;
      padding: 10px;
      background: none;
      border: none;
      color: var(--muted);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 500;
      border-radius: 7px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab.active {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .form { display: none; flex-direction: column; gap: 16px; }
    .form.active { display: flex; animation: fadeIn 0.3s ease; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .form-title {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 22px;
      letter-spacing: -0.5px;
      margin-bottom: 2px;
    }

    .form-subtitle {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .field { display: flex; flex-direction: column; gap: 6px; }

    label {
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 13px 16px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus { border-color: var(--accent); }
    input::placeholder { color: #333; }

    .btn {
      padding: 14px;
      background: var(--accent);
      color: #0a0a0a;
      border: none;
      border-radius: var(--radius);
      font-family: 'Syne', sans-serif;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 4px;
      transition: opacity 0.2s, transform 0.15s;
    }

    .btn:hover  { opacity: 0.88; transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .msg {
      font-size: 13px;
      padding: 12px 14px;
      border-radius: 8px;
      display: none;
    }

    .msg.success { background: rgba(200,245,90,0.1); color: var(--accent); border: 1px solid rgba(200,245,90,0.2); display: block; }
    .msg.error   { background: rgba(255,95,95,0.1);  color: var(--error);  border: 1px solid rgba(255,95,95,0.2);  display: block; }

    .footer-text {
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      margin-top: 20px;
    }

    .footer-text span {
      color: var(--accent);
      cursor: pointer;
      font-weight: 500;
    }

    .footer-text span:hover { text-decoration: underline; }

    @media (max-width: 480px) {
      .card { width: 100%; margin: 20px; padding: 28px; }
    }
  </style>
</head>
<body>

<div class="card">

  <div class="logo">
    <span class="logo-dot"></span> YourApp
  </div>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('login')">Login</button>
    <button class="tab" onclick="switchTab('signup')">Sign Up</button>
  </div>

  <!-- LOGIN FORM -->
  <div class="form active" id="loginForm">
    <div>
      <div class="form-title">Welcome back</div>
      <div class="form-subtitle">Enter your details to log in</div>
    </div>

    <div id="loginMsg" class="msg"></div>

    <div class="field">
      <label>Username</label>
      <input type="text" id="loginUsername" placeholder="yourname"/>
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="loginPassword" placeholder="••••••••"/>
    </div>

    <button class="btn" onclick="login()">Login</button>
    <p class="footer-text">No account? <span onclick="switchTab('signup')">Sign up</span></p>
  </div>

  <!-- SIGNUP FORM -->
  <div class="form" id="signupForm">
    <div>
      <div class="form-title">Create account</div>
      <div class="form-subtitle">Fill in your details to sign up</div>
    </div>

    <div id="signupMsg" class="msg"></div>

    <div class="field">
      <label>Username</label>
      <input type="text" id="signupUsername" placeholder="yourname"/>
    </div>
    <div class="field">
      <label>Email <span style="color:#444;font-weight:300">(optional)</span></label>
      <input type="email" id="signupEmail" placeholder="you@email.com"/>
    </div>
    <div class="field">
      <label>Phone <span style="color:#444;font-weight:300">(optional)</span></label>
      <input type="tel" id="signupPhone" placeholder="+254 7XX XXX XXX"/>
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="signupPassword" placeholder="••••••••"/>
    </div>

    <button class="btn" onclick="signup()">Create Account</button>
    <p class="footer-text">Already have an account? <span onclick="switchTab('login')">Login</span></p>
  </div>

</div>

<script>
  const API = "https://my-auth-app-23h6.onrender.com";

  function switchTab(tab) {
    document.querySelectorAll(".tab").forEach((t, i) =>
      t.classList.toggle("active", (tab === "login" ? 0 : 1) === i)
    );
    document.getElementById("loginForm").classList.toggle("active", tab === "login");
    document.getElementById("signupForm").classList.toggle("active", tab === "signup");
    showMsg("loginMsg", "", "");
    showMsg("signupMsg", "", "");
  }

  function showMsg(id, text, type) {
    const el = document.getElementById(id);
    el.textContent = text;
    el.className = "msg " + (text ? type : "");
  }

  async function login() {
    const username = document.getElementById("loginUsername").value.trim();
    const password = document.getElementById("loginPassword").value;
    const btn = document.querySelector("#loginForm .btn");

    if (!username || !password) return showMsg("loginMsg", "Please fill in all fields.", "error");

    btn.disabled = true;
    btn.textContent = "Logging in...";

    try {
      const res = await fetch(`${API}/login`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password })
      });

      const data = await res.json();

      if (!res.ok) {
        showMsg("loginMsg", data.message || "Login failed.", "error");
      } else {
        localStorage.setItem("token", data.token);
        showMsg("loginMsg", "Login successful. Redirecting...", "success");
        setTimeout(() => window.location.href = "/products.html", 1000);
      }

    } catch (err) {
      showMsg("loginMsg", "Server error. Is your backend running?", "error");
    } finally {
      btn.disabled = false;
      btn.textContent = "Login";
    }
  }

  async function signup() {
    const username = document.getElementById("signupUsername").value.trim();
    const email    = document.getElementById("signupEmail").value.trim();
    const phone    = document.getElementById("signupPhone").value.trim();
    const password = document.getElementById("signupPassword").value;
    const btn = document.querySelector("#signupForm .btn");

    if (!username || !password) return showMsg("signupMsg", "Username and password are required.", "error");

    btn.disabled = true;
    btn.textContent = "Creating account...";

    try {
      const res = await fetch(`${API}/register`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, email, phone, password })
      });

      const data = await res.json();

      if (!res.ok) {
        showMsg("signupMsg", data.message || "Registration failed.", "error");
      } else {
        showMsg("signupMsg", "Account created. Switching to login...", "success");
        setTimeout(() => switchTab("login"), 1500);
      }

    } catch (err) {
      showMsg("signupMsg", "Server error. Is your backend running?", "error");
    } finally {
      btn.disabled = false;
      btn.textContent = "Create Account";
    }
  }
</script>
<script src="/shared.js"></script>
</body>
</html>
