<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <link rel="icon" type="image/x-icon" href="/favicon.ico"/>
  <link rel="manifest" href="/manifest.json"/>
  <meta name="theme-color" content="#c8f55a"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Products</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0a;
      --surface: #111111;
      --border: #222222;
      --accent: #c8f55a;
      --accent-dim: rgba(200,245,90,0.1);
      --text: #f0f0f0;
      --muted: #555;
      --error: #ff5f5f;
      --radius: 14px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
    }

    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 40px;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
    }

    .logo {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-dot { width: 9px; height: 9px; background: var(--accent); border-radius: 50%; }

    .nav-links { display: flex; gap: 12px; }

    .nav-link {
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      text-decoration: none;
      color: var(--muted);
      border: 1px solid transparent;
      transition: all 0.2s;
    }

    .nav-link:hover { color: var(--text); border-color: var(--border); }
    .nav-link.active { color: var(--accent); border-color: rgba(200,245,90,0.3); background: var(--accent-dim); }

    .btn-logout {
      padding: 8px 18px;
      background: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-logout:hover { border-color: var(--error); color: var(--error); }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 60px 40px;
      animation: fadeUp 0.5s cubic-bezier(0.22,1,0.36,1) both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .page-header {
      margin-bottom: 40px;
    }

    .page-title {
      font-family: 'Syne', sans-serif;
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -1px;
      margin-bottom: 8px;
    }

    .page-title span { color: var(--accent); }

    .page-sub {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 24px;
    }

    .search-wrap {
      max-width: 380px;
      position: relative;
    }

    .search-wrap input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 11px 16px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-wrap input:focus { border-color: var(--accent); }
    .search-wrap input::placeholder { color: #333; }

    #loadingProducts {
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      padding: 80px 20px;
    }

    .spinner {
      width: 28px; height: 28px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 14px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .result-label {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 20px;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .product-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      transition: border-color 0.2s;
    }

    .product-card:hover { border-color: #2a2a2a; }

    .card-img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      background: #0d0d0d;
      display: block;
    }

    .card-img-placeholder {
      width: 100%;
      height: 200px;
      background: #0d0d0d;
      border-bottom: 1px solid var(--border);
    }

    .card-body { padding: 20px; }

    .card-name {
      font-family: 'Syne', sans-serif;
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .card-desc {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.5;
      margin-bottom: 18px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-price {
      font-family: 'Syne', sans-serif;
      font-size: 18px;
      font-weight: 800;
      color: var(--accent);
    }

    .btn-buy {
      padding: 9px 20px;
      background: var(--accent);
      color: #0a0a0a;
      border: none;
      border-radius: 8px;
      font-family: 'Syne', sans-serif;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn-buy:hover { opacity: 0.85; }

    .empty {
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      padding: 80px 20px;
      grid-column: 1 / -1;
    }

    @media (max-width: 900px) {
      .product-grid { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 640px) {
      nav { padding: 16px 20px; }
      main { padding: 40px 20px; }
      .product-grid { grid-template-columns: 1fr; }
      .page-title { font-size: 26px; }
    }
  </style>
</head>
<body>

<nav>
  <div class="logo"><span class="logo-dot"></span> YourApp</div>
  <div class="nav-links" id="navLinks">
    <a href="/dashboard.html" class="nav-link">Dashboard</a>
    <a href="/products.html" class="nav-link active">Products</a>
    <a href="/admin.html" class="nav-link">Admin</a>
  </div>
  <button class="btn-logout" id="navBtn" onclick="logout()">Logout</button>
</nav>

<main>
  <div class="page-header">
    <div class="page-title">All <span>Products</span></div>
    <div class="page-sub">Browse what we have in stock. Prices in KSh.</div>
    <div class="search-wrap">
      <input type="text" id="searchInput" placeholder="Search products..." oninput="filterProducts()"/>
    </div>
  </div>

  <div id="resultLabel" class="result-label"></div>

  <div id="loadingProducts">
    <div class="spinner"></div>
    Loading...
  </div>

  <div class="product-grid" id="productGrid"></div>
</main>

<script>
  const API = "https://my-auth-app-23h6.onrender.com";
  let allProducts = [];

  // Show login button if not logged in
  const token = localStorage.getItem("token");
  if (!token) {
    document.getElementById("navLinks").innerHTML = "";
    const btn = document.getElementById("navBtn");
    btn.textContent = "Login";
    btn.onclick = () => window.location.href = "/login.html";
  }

  function logout() {
    localStorage.removeItem("token");
    window.location.href = "/login.html";
  }

  async function loadProducts() {
    try {
      const res = await fetch(`${API}/products`);
      allProducts = await res.json();
      document.getElementById("loadingProducts").style.display = "none";
      renderProducts(allProducts);
    } catch (err) {
      document.getElementById("loadingProducts").innerHTML =
        `<div style="color:var(--error);font-size:14px;">Could not load products. Try again later.</div>`;
    }
  }

  function renderProducts(products) {
    const grid  = document.getElementById("productGrid");
    const label = document.getElementById("resultLabel");
    grid.innerHTML = "";

    label.textContent = products.length > 0
      ? `${products.length} product${products.length !== 1 ? "s" : ""} found`
      : "";

    if (products.length === 0) {
      grid.innerHTML = `<div class="empty">No products found.</div>`;
      return;
    }

    products.forEach((p, i) => {
      const card = document.createElement("div");
      card.className = "product-card";
      card.innerHTML = `
        ${p.image
          ? `<img class="card-img" src="${p.image}" alt="${p.name}" onerror="this.style.display='none'">`
          : `<div class="card-img-placeholder"></div>`}
        <div class="card-body">
          <div class="card-name">${p.name}</div>
          <div class="card-desc">${p.description || "No description available."}</div>
          <div class="card-footer">
            <div class="card-price">KSh ${Number(p.price).toFixed(0)}</div>
            <button class="btn-buy" onclick="buyProduct('${p.name}', ${p.price})">Buy Now</button>
          </div>
        </div>
      `;
      grid.appendChild(card);
    });
  }

  function filterProducts() {
    const query = document.getElementById("searchInput").value.toLowerCase();
    const filtered = allProducts.filter(p =>
      p.name.toLowerCase().includes(query) ||
      (p.description && p.description.toLowerCase().includes(query))
    );
    renderProducts(filtered);
  }

  async function buyProduct(name, price) {
    const token = localStorage.getItem("token");
    if (!token) {
      window.location.href = "/login.html";
      return;
    }

    const phone = prompt("Enter your M-Pesa number (e.g. 2547XXXXXXXX):");
    if (!phone) return;

    try {
      const res = await fetch(`${API}/mpesa/pay`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          authorization: `Bearer ${token}`
        },
        body: JSON.stringify({ phone, amount: price, productName: name })
      });

      const data = await res.json();

      if (data.ResponseCode === "0") {
        alert("Check your phone for the M-Pesa prompt.");
      } else {
        alert("Payment failed. " + (data.errorMessage || "Please try again."));
      }
    } catch (err) {
      alert("Could not process payment. Try again.");
    }
  }

  loadProducts();
</script>
<script src="/shared.js"></script>
</body>
</html>
